    <!-- SCRIPT PEGO NO GEMINI IA, USADO PARA EVITAR DISTORÇÃO NA PIXEL ART -->
    <script>
      AFRAME.registerComponent('pixel-art', {
        init: function () {
          this.el.addEventListener('materialtextureloaded', () => {
            const mesh = this.el.getObject3D('mesh');
            if (mesh && mesh.material && mesh.material.map) {
              mesh.material.map.magFilter = THREE.NearestFilter;
              mesh.material.map.minFilter = THREE.NearestFilter;
              mesh.material.map.needsUpdate = true;
            }
          });
        }
      });
    </script>
  </head>
