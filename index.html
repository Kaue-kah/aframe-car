<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/n5ro/aframe-physics-system@v4.0.1/dist/aframe-physics-system.min.js"></script>
  </head>
  <body>
    <header style="position: fixed; top: 0; left: 0; width: 100%; background: rgba(0,0,0,0.1); color: white; font-family: Arial; font-size: 16px; padding: 10px; z-index: 100;">
      <h1 style="margin: 0; font-family: 'Segoe UI'; color:blueviolet">Pontuação: <span id="pontos">0</span></h1>
      <h1 style="margin: 0; color: yellow; font-family: 'Segoe UI';">Velocidade: <span id="velocidade">0 Px/s</span></h1>
      <h1 style="margin: 0; color: yellow; font-family: 'Segoe UI';">Inclinação: <span id="inclinacao">0 Px/s</span></h1>
      <p id="status" style="margin: 5px 0 0 0; font-weight: bold; color: orange;">Carregando modelo de IA...</p>
    </header>
    
    <div style="position: fixed; bottom: 10px; right: 10px; width: 200px; height: 150px; border: 2px solid blueviolet; border-radius: 8px; overflow: hidden; z-index: 100; background: black;">
        <video id="webcam" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);"></video>
        <canvas id="canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1);"></canvas>
    </div>

    <a-scene physics="gravity: 0" keyboard-shortcuts="" screenshot="" xr-mode-ui="" device-orientation-permission-ui="">
      <a-plane static-body src="img/pista.jpg" position="0 0 0" rotation="-90 0 0" width="400" height="400" color="#ffffff"></a-plane>
      <!-- Obstáculos -->
      <a-box static-body id="obs1" position="5 0.5 -3"  width="1" height="1" depth="1" color="orange"></a-box>
      <a-box static-body id="obs2" position="-4 0.5 2"  width="1" height="1" depth="1" color="red"></a-box>
      <!-- Coletáveis -->
      <a-box static-body id="obs3" position="2 0.5 -1"  width="1" height="1" depth="1" color="green"></a-box>
      <a-box static-body id="obs4" position="-1 0.5 4"  width="1" height="1" depth="1" color="blue"></a-box>
      <!-- Carro -->
      <a-entity dynamic-body="mass: 1; linearDamping: 1; angularDamping: 1" position="1.4711 0.43002 -3.052" rotation="0 90 0" id="carro">    
          <a-box id="hitbox" width="1" height="0.5" depth="2" position="-0.08128 0.04736 0.00866" rotation="0 90 0" color="#ffffff" material="src: img/pintura.jpg" geometry="height: 0.39; width: 1.1"></a-box>
          <a-box width="1" height="0.5" depth="2" position="-0.24707 0.40685 0.00866" rotation="0 90 0" color="#ffffff" geometry="depth: 1.07; height: 0.34; width: 0.95" material="src: img/pintura.jpg"></a-box>
          <a-box width="1" height="0.5" depth="2" position="0.30677 0.39414 0.01435" rotation="0 90 0" color="#4CC3D9" geometry="depth: 0.08; height: 0.21; width: 0.82" material="color: #ffffff"></a-box>
          <a-box width="1" height="0.5" depth="2" position="-0.989 0.33422 0.00866" rotation="-20 90 0" color="#5FC7D9" geometry="depth: 0.1; height: 0.34; width: 0.95" material="src: img/pintura.jpg"></a-box>
          <a-box width="1" height="0.5" depth="2" position="0.91303 0.03867 0.30019" rotation="0 90 0" color="#4CC3D9" geometry="depth: 0.08; height: 0.18; width: 0.33" material="color: #ffee38"></a-box>
          <a-box width="1" height="0.5" depth="2" position="-1.07894 0.03867 0.30019" rotation="0 90 0" color="#4CC3D9" geometry="depth: 0.08; height: 0.18; width: 0.33" material="color: #ff0000"></a-box>
          <a-box width="1" height="0.5" depth="2" position="0.91303 0.03867 -0.30379" rotation="0 90 0" color="#4CC3D9" geometry="depth: 0.08; height: 0.18; width: 0.33" material="color: #ffee38"></a-box>
          <a-box width="1" height="0.5" depth="2" position="-1.08099 0.03867 -0.30379" rotation="0 90 0" color="#4CC3D9" geometry="depth: 0.08; height: 0.18; width: 0.33" material="color: #ff0000"></a-box>
          <!-- Rodas -->
          <a-cylinder class="roda" material="src: img/roda.jpg" position="0.5289 -0.13002 0.452"   radius="0.5" color="#555555" geometry="height: 0.27; radius: 0.3" rotation="90 0 0"></a-cylinder>
          <a-cylinder class="roda" material="src: img/roda.jpg" position="0.5289 -0.13002 -0.448"  radius="0.5" color="#555555" geometry="height: 0.27; radius: 0.3" rotation="90 0 0"></a-cylinder>
          <a-cylinder class="roda" material="src: img/roda.jpg" position="-0.6711 -0.13002 0.452"  radius="0.5" color="#555555" geometry="height: 0.3;  radius: 0.3" rotation="90 0 0"></a-cylinder>
          <a-cylinder class="roda" material="src: img/roda.jpg" position="-0.6711 -0.13002 -0.448" radius="0.5" color="#555555" geometry="height: 0.3;  radius: 0.3" rotation="90 0 0"></a-cylinder>
          <a-entity camera="" position="-5 1.4 0" rotation="0 -90 0" id="camera"></a-entity>
      </a-entity>

      <a-sky color="#ECECEC" src="img/ceu.jpg"></a-sky>
      <script src="app.js" type="module"></script>
    </a-scene>
  </body>

  <div style="position: fixed; bottom: 10px; left: 10px; color: white; font-family: Arial; font-size: 12px; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 5px; z-index: 100;">
    Tire and track textures by Freepik (www.freepik.com)<br>
    Game by Kauê Jales
  </div>
</html>
